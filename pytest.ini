[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --browser chromium
markers =
    sop(title): journey is documented as an SOP generated from this test's recorded steps
    negative: negative / invalid-input scenario
    boundary: boundary-value scenario
    canary: deliberately failing test used to exercise the triage -> Jira path (needs RUN_CANARIES=1)
    expected_class(name): ground-truth failure class, used to score the AI triage
